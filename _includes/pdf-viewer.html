<style>
    .pdfjs-wrapper {
      width: 100%;
      height: 80vh;
      overflow-y: auto;
      border: 1px solid #ddd;
      margin: 1.5em 0;
      background: #f4f4f4;
    }
    
    .pdfjs-pages canvas {
      max-width: 100%;
      margin: 0 auto 8px auto;
      display: block;
    }
</style>

<div class="pdfjs-wrapper" id="pdfjs-wrapper-{{ include.id | default: "1" }}">
  <div class="pdfjs-pages" id="pdfjs-pages-{{ include.id | default: "1" }}"></div>
</div>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

  const url = "{{ include.src | relative_url }}";
  const pagesEl = document.getElementById("pdfjs-pages-{{ include.id | default: "1" }}");

  pdfjsLib.getDocument(url).promise.then(async (pdf) => {
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const scale = pagesEl.clientWidth / page.getViewport({ scale: 1 }).width;
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.display = "block";
      canvas.style.marginBottom = "8px";
      pagesEl.appendChild(canvas);

      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    }
  }).catch((err) => {
    pagesEl.innerHTML = `<p>Unable to load PDF. <a href="${url}">Download it directly</a>.</p>`;
    console.error(err);
  });
</script>
