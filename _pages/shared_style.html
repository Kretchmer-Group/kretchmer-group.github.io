<!-- Shared styling for the page title and the site name in the navbar. Pulled into each page with include_relative. -->
<style>
  .post-title {
    font-weight: 700;
    font-size: 3rem;
    color: var(--global-theme-color);
  }
  .post-title::after {
    content: "";
    display: block;
    width: 4rem;
    height: 0.3rem;
    margin-top: 0.6rem;
    border-radius: 0.2rem;
    background: var(--global-theme-color);
  }
  /* Site name in the top-left of the navbar (hidden on the home page) */
  .navbar-brand.title {
    font-weight: 700 !important;
    font-size: 1.6rem;
  }
  /* "N more authors" text: the theme's gray is just under the 4.5:1 minimum contrast */
  .publications ol.bibliography li .author > span.more-authors {
    --global-text-color-light: #6b6b6b;
  }
  html[data-theme="dark"] .publications ol.bibliography li .author > span.more-authors {
    --global-text-color-light: #9a9a9a;
  }
  /* Underline links in body text and the footer so they don't rely on color alone */
  article p a:not(.btn):not(.join-cta),
  article li a:not(.btn),
  footer a {
    text-decoration: underline;
    text-underline-offset: 0.15em;
  }
  /* Body text size shared with the People page blurbs: home page intro and Research descriptions */
  .home-intro,
  .projects .project-description p {
    font-size: 1.125rem;
    line-height: 1.7;
  }
</style>
